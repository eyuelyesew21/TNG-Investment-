<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TNG Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>💎 TNG Dashboard</h1>
</header>

<div class="container">

  <!-- USER INFO -->
  <div class="card">
    <h2>👤 Account</h2>

    <p>Phone: <span id="userPhone"></span></p>
    <p>Balance: <b>ETB <span id="userBalance"></span></b></p>

    <p>Referral: <span id="userReferral"></span></p>

    <p>VIP Status: <span id="vipStatus">-</span></p>
    <p>Expires: <span id="vipExpiry">-</span></p>

    <input id="referralLink" readonly>
    <button onclick="copyReferralLink()">Copy Link</button>
  </div>

  <!-- WITHDRAW RULE -->
  <div class="card">
    <h2>🏧 Withdrawal Rules</h2>
    <p>Min: 300 ETB</p>
    <p>Fee: 10%</p>
    <p>Time: 5AM - 11PM</p>
    <p style="color:red;">VIP Required</p>
  </div>

  <!-- VIP -->
  <div class="card">
    <h2>💎 VIP Plans</h2>

    <button onclick="buyVip('VIP1',1500)">VIP1</button>
    <button onclick="buyVip('VIP2',3000)">VIP2</button>
    <button onclick="buyVip('VIP3',6000)">VIP3</button>
    <button onclick="buyVip('VIP4',12000)">VIP4</button>
    <button onclick="buyVip('VIP5',24000)">VIP5</button>
    <button onclick="buyVip('VIP6',48000)">VIP6</button>
    <button onclick="buyVip('VIP7',96000)">VIP7</button>
  </div>

  <!-- UPGRADE -->
  <div class="card">
    <h2>⬆ Upgrade</h2>

    <button onclick="upgradeVip('VIP2',3000)">VIP2</button>
    <button onclick="upgradeVip('VIP3',6000)">VIP3</button>
    <button onclick="upgradeVip('VIP4',12000)">VIP4</button>
  </div>

  <!-- WITHDRAW -->
  <div class="card">
    <h2>🏧 Withdraw</h2>

    <input id="withdrawAmount" type="number" placeholder="Amount">

    <button onclick="requestWithdrawal(document.getElementById('withdrawAmount').value)">
      Request
    </button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="script.js"></script>

</body>
</html>
